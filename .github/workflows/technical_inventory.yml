name: Generate Technical Inventory Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday at midnight UTC
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  generate_snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create snapshot directory
        run: mkdir -p technical-inventory-snapshot

      - name: Generate directory tree
        run: |-
          tree -J -L 3 -I 'node_modules|dist|.git|.github' > technical-inventory-snapshot/directory_tree.json
        continue-on-error: true # tree might not be installed by default, or fail on large repos

      - name: Copy manifest files and configs
        run: |
          find . -maxdepth 2 -type f -name 'package.json' -o -name 'package-lock.json' -o -name 'yarn.lock' -o -name 'pnpm-lock.yaml' -o -name 'bun.lockb' -o -name 'tsconfig.json' -o -name 'vite.config.*' -o -name 'Dockerfile' -o -name 'docker-compose.yml' -o -name 'README.md' | xargs -I {} cp --parents {} technical-inventory-snapshot/
          cp -r .github/workflows technical-inventory-snapshot/ || true

      - name: Archive source and test folders
        run: |
          tar -czf technical-inventory-snapshot/src.tar.gz src/ || true
          tar -czf technical-inventory-snapshot/tests.tar.gz tests/ || true

      - name: Upload technical inventory snapshot
        uses: actions/upload-artifact@v4
        with:
          name: technical-inventory-snapshot
          path: technical-inventory-snapshot/
          retention-days: 7
